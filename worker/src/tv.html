<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sigma Nu TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Oswald:wght@400;500;600&family=Noto+Serif+Display:wght@900&family=Playfair+Display:wght@800;900&family=Yellowtail&display=swap">
<link rel="stylesheet" href="/static/menu.css">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #0b1240; overflow: hidden; cursor: none; }
  #frame { position: fixed; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: #0b1240; }
  .screen { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity 0.9s ease, visibility 0s linear 0.9s; }
  .screen.on { opacity: 1; visibility: visible; transition: opacity 0.9s ease, visibility 0s; }

  /* uploaded slide */
  #s-slide { background: #000; display: flex; align-items: center; justify-content: center; }
  #s-slide img { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; }

  /* calendar */
  #s-calendar { background: #fbf8f2; font-family: "Oswald", sans-serif; }
  .cal-head { position: absolute; left: 0; right: 0; top: 0; height: 120px; background: #14205c; color: #fff; display: flex; align-items: center; padding: 0 60px; gap: 28px; border-bottom: 6px solid #ea6a22; }
  .cal-letters { font-family: "Noto Serif Display", serif; font-weight: 900; font-size: 84px; line-height: 1; color: #fff; -webkit-text-stroke: 3px #ea6a22; paint-order: stroke fill; }
  .cal-head .ttl { font-family: "Playfair Display", serif; font-weight: 900; font-size: 60px; letter-spacing: 4px; }
  .cal-head .ttl span { color: #ea6a22; }
  .cal-head .clk { margin-left: auto; font-size: 40px; font-weight: 500; }
  .cal-head .clk b { color: #ea6a22; font-weight: 600; }
  .cal-body { position: absolute; left: 50px; right: 50px; top: 156px; bottom: 40px; background: #fff; border: 4px solid #ea6a22; border-radius: 10px; overflow: hidden; }
  .cal-head .ttl small { font-family: "Oswald", sans-serif; font-weight: 500; font-size: 34px; letter-spacing: 3px; color: #c9cde6; margin-left: 18px; }
  .cal-body { display: flex; flex-direction: column; }
  .ce { font-family: "Barlow Condensed", sans-serif; font-weight: 500; color: #14205c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; }
  .ce b { font-weight: 600; }
  .ce .tx { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .ce i { flex: none; width: 12px; height: 12px; border-radius: 50%; }
  .ce-all { color: #fff; border-radius: 6px; padding: 2px 10px; font-weight: 600; display: block; }
  .ce-more { color: #6b6f86; font-style: italic; }
  .c-legend { flex: none; height: 52px; border-top: 2px solid #f0e6da; display: flex; align-items: center; justify-content: center; gap: 30px; font: 500 24px "Barlow Condensed", sans-serif; color: #14205c; overflow: hidden; white-space: nowrap; }
  .c-legend span { display: inline-flex; align-items: center; gap: 8px; }
  .c-legend i { width: 16px; height: 16px; border-radius: 4px; }
  .c-empty, .c-msg { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; font: 500 40px "Oswald", sans-serif; color: #6b6f86; padding: 40px; }
  /* week */
  .cw { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); }
  .cw-col { display: flex; flex-direction: column; border-left: 2px solid #f0e6da; min-height: 0; }
  .cw-col:first-child { border-left: 0; }
  .cw-h { flex: none; height: 84px; background: #14205c; color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; font: 600 38px "Oswald", sans-serif; }
  .cw-h .dt { color: #ea6a22; font-weight: 500; }
  .cw-h .tag { font-size: 18px; letter-spacing: 2px; background: #14205c; color: #fff; padding: 1px 8px; border-radius: 4px; }
  .cw-col.today { background: #fdeee3; }
  .cw-col.today .cw-h { background: #ea6a22; }
  .cw-col.today .cw-h .dt { color: #14205c; }
  .cw-ev { flex: 1; min-height: 0; overflow: hidden; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
  .cw-ev .ce { font-size: 30px; white-space: normal; align-items: flex-start; line-height: 1.15; }
  .cw-ev .ce b { display: block; color: #ea6a22; }
  .cw-ev .ce i { margin-top: 10px; }
  .cw-ev .ce-all { font-size: 28px; }
  .cw-none { color: #c4c0b8; font: 500 34px "Oswald", sans-serif; text-align: center; margin-top: 20px; }
  /* month */
  .cm { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); }
  .cm-wd { background: #14205c; color: #fff; display: flex; align-items: center; justify-content: center; font: 600 28px "Oswald", sans-serif; letter-spacing: 2px; }
  .cm-cell { border-left: 1px solid #ece4d8; border-top: 1px solid #ece4d8; padding: 4px 6px; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .cm-cell.out { background: #f7f4ef; }
  .cm-cell.out .cm-n { color: #b9b6c4; }
  .cm-n { font: 500 24px "Oswald", sans-serif; color: #14205c; text-align: center; height: 34px; flex: none; }
  .cm-n span { display: inline-block; min-width: 34px; height: 34px; line-height: 34px; border-radius: 17px; }
  .cm-cell.today { background: #fdeee3; }
  .cm-cell.today .cm-n span { background: #ea6a22; color: #fff; }
  .cm-ev { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 3px; }
  .cm-ev .ce { font-size: 21px; }
  .cm-ev .ce i { width: 9px; height: 9px; }
  .cm-ev .ce-all { font-size: 20px; padding: 0 6px; border-radius: 4px; }
  /* agenda */
  .ca { flex: 1; min-height: 0; column-count: 2; column-gap: 50px; padding: 26px 40px; overflow: hidden; column-fill: auto; }
  .ca-day { break-inside: avoid; margin-bottom: 22px; }
  .ca-h { font: 600 32px "Oswald", sans-serif; color: #ea6a22; border-bottom: 2px solid #f0e6da; margin-bottom: 8px; letter-spacing: 1px; }
  .ca-day.today .ca-h { color: #14205c; }
  .ca .ce { font-size: 32px; margin: 4px 0; }
  .ca .ce-all { display: inline-block; }

  /* empty state */
  #s-empty { background: #14205c; color: #fff; font-family: "Oswald", sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #s-empty .big { font-family: "Noto Serif Display", serif; font-weight: 900; font-size: 200px; color: #14205c; -webkit-text-stroke: 5px #ea6a22; paint-order: stroke fill; }
  #s-empty p { font-size: 46px; margin: 10px 0 0; }
  #s-empty code { color: #ea6a22; }

  /* progress */
  #bar { position: absolute; left: 0; bottom: 0; height: 8px; width: 0; background: #ea6a22; z-index: 5; }
  #offline { position: absolute; right: 24px; top: 20px; z-index: 6; background: rgba(226,52,42,0.92); color: #fff; font: 500 22px "Oswald", sans-serif; padding: 6px 14px; border-radius: 6px; display: none; }
</style>
</head>
<body>
<div id="frame"><div id="stage">
  <div class="screen" id="s-menu"></div>
  <div class="screen" id="s-slide"><img id="slideImg" alt=""></div>
  <div class="screen" id="s-calendar">
    <div class="cal-head"><div class="cal-letters">&Sigma;&Nu;</div><div class="ttl">CHAPTER <span>CALENDAR</span><small id="calRange"></small></div><div class="clk" id="calClock"></div></div>
    <div class="cal-body" id="calBody"></div>
  </div>
  <div class="screen" id="s-empty"><div class="big">&Sigma;&Nu;</div><p>Nothing uploaded yet.</p><p>Go to <code id="adminUrl"></code> on your phone.</p></div>
  <div id="bar"></div>
  <div id="offline">Offline — showing last saved content</div>
</div>
</div>
<script src="/static/menu.js"></script>
<script src="/static/cal.js"></script>
<script>
(function () {
  var POLL_MS = 60 * 1000;            // check for new uploads every minute
  var HARD_RELOAD_MS = 6 * 3600 * 1000; // full page refresh every 6 hours
  var stage = document.getElementById("stage");
  var state = null, order = [], idx = -1, timer = null, calKey = "", started = false, calLoadedAt = 0, menuKey = "", curId = "";
  var CAL_REFRESH_MS = 3 * 60 * 1000; // reload the calendar at most every 3 minutes, while it is off screen

  // Fit the 1920x1080 design to whatever size the TV browser reports.
  // Fire TV's WebView can report its size late or oddly, so measure several ways and re-check often.
  function viewSize() {
    var f = document.getElementById("frame");
    var cands = [[f.clientWidth, f.clientHeight], [document.documentElement.clientWidth, document.documentElement.clientHeight], [window.innerWidth, window.innerHeight]];
    if (window.visualViewport) cands.push([window.visualViewport.width, window.visualViewport.height]);
    var best = null;
    for (var i = 0; i < cands.length; i++) {
      var c = cands[i];
      if (c[0] > 50 && c[1] > 50 && (!best || c[0] < best[0])) best = c;
    }
    return best || [1920, 1080];
  }
  var lastScale = "";
  function scale() {
    var v = viewSize(), s = Math.min(v[0] / 1920, v[1] / 1080);
    var t = "translate(" + (v[0] - 1920 * s) / 2 + "px," + (v[1] - 1080 * s) / 2 + "px) scale(" + s + ")";
    if (t !== lastScale) { stage.style.transform = t; lastScale = t; }
  }
  setTimeout(scale, 300); setTimeout(scale, 1500); setInterval(scale, 5000);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", scale);
  window.addEventListener("resize", scale); scale();
  document.getElementById("adminUrl").textContent = location.host + "/admin";

  function tz() { return (state && state.settings && state.settings.timezone) || "America/New_York"; }

  var calLoading = false;
  function buildCalendar(force) {
    var st = state.settings, n = st.calendarCount || 0;
    var key = (st.calendarHash || "") + "|" + n + "|" + st.calendarMode + "|" + tz();
    if ((key === calKey && !force) || calLoading) return;
    calKey = key;
    calLoadedAt = Date.now();
    var body = document.getElementById("calBody");
    if (!n) { body.innerHTML = ""; return; }
    calLoading = true;
    CalFeed.load(n, tz(), function (data) {
      calLoading = false;
      var okCount = data.sources.filter(function (x) { return x.ok; }).length;
      if (!okCount) {
        body.innerHTML = '<div class="c-msg">Can\'t read any of the calendars yet.<br>Open ' + location.host + '/admin to see which ones need to be made public.</div>';
        return;
      }
      CalFeed.render(body, data, { mode: st.calendarMode, timezone: tz(), setRange: function (t) { document.getElementById("calRange").textContent = t; } });
    });
  }

  // Re-draw the menu only when something actually changed (new upload or a new day),
  // and only while it's off screen, so it never blanks out mid-display.
  function dayKey() {
    try { return new Date().toLocaleDateString("en-US", { timeZone: tz() }); } catch (e) { return new Date().toDateString(); }
  }
  function ensureMenu(allowVisible) {
    if (!state || !state.menu) return;
    var k = (state.menuUpdated || "") + "|" + dayKey();
    if (k === menuKey) return;
    if (curId === "menu" && !allowVisible) return; // wait until it's off screen
    menuKey = k;
    MenuRender.render(document.getElementById("s-menu"), state.menu, { clock: true, timezone: tz() });
  }

  function render() {
    var s = state;
    ensureMenu(false);
    if (s.slide) {
      var img = document.getElementById("slideImg");
      if (img.getAttribute("src") !== s.slide.url) img.src = s.slide.url;
    }
    buildCalendar();
    order = (s.settings.screens || []).filter(function (x) {
      if (!x.enabled) return false;
      if (x.id === "menu") return !!s.menu;
      if (x.id === "slide") return !!s.slide;
      if (x.id === "calendar") return (s.settings.calendarCount || 0) > 0;
      return false;
    });
  }

  function show(id) {
    curId = id;
    var all = document.querySelectorAll(".screen");
    for (var i = 0; i < all.length; i++) all[i].classList.toggle("on", all[i].id === "s-" + id);
  }

  function next() {
    clearTimeout(timer);
    if (!order.length) { show("empty"); bar(0); timer = setTimeout(next, 10000); return; }
    idx = (idx + 1) % order.length;
    var sc = order[idx];
    if (sc.id === "menu") ensureMenu(true); // still hidden at this point
    show(sc.id);
    var after = order[(idx + 1) % order.length];
    if (after && after.id === "menu" && sc.id !== "menu") setTimeout(function () { ensureMenu(false); }, 1500);
    // refresh the calendar in the background when the screen *before* it comes up, so it's fresh and already loaded
    var upcoming = order[(idx + 1) % order.length];
    if (upcoming && upcoming.id === "calendar" && sc.id !== "calendar" && Date.now() - calLoadedAt > CAL_REFRESH_MS) {
      setTimeout(function () { buildCalendar(true); }, 1500);
    } else if (order.length === 1 && sc.id === "calendar" && Date.now() - calLoadedAt > CAL_REFRESH_MS) {
      buildCalendar(true); // calendar is the only screen: refresh it in place
    }
    bar(sc.seconds);
    timer = setTimeout(next, sc.seconds * 1000);
  }

  function bar(sec) {
    var b = document.getElementById("bar");
    b.style.transition = "none"; b.style.width = "0";
    void b.offsetWidth;
    if (sec && order.length > 1) { b.style.transition = "width " + sec + "s linear"; b.style.width = "100%"; }
  }

  function calClock() {
    var d = new Date(), el = document.getElementById("calClock");
    try {
      el.innerHTML = d.toLocaleDateString("en-US", { timeZone: tz(), weekday: "long", month: "long", day: "numeric" }) +
        " &nbsp;<b>" + d.toLocaleTimeString("en-US", { timeZone: tz(), hour: "numeric", minute: "2-digit" }) + "</b>";
    } catch (e) { el.textContent = d.toDateString(); }
  }
  setInterval(calClock, 15000);

  function apply(newState, first) {
    var changed = !state || newState.version !== state.version;
    state = newState;
    if (changed) {
      render(); calClock();
      try { localStorage.setItem("tvState", JSON.stringify(newState)); } catch (e) {}
      if (!started) { started = true; idx = -1; next(); }
    }
  }

  function poll(first) {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "/api/state?t=" + Date.now());
    xhr.timeout = 20000;
    xhr.onload = function () {
      if (xhr.status === 200) {
        document.getElementById("offline").style.display = "none";
        try { apply(JSON.parse(xhr.responseText), first); } catch (e) {}
      } else fail(first);
    };
    xhr.onerror = xhr.ontimeout = function () { fail(first); };
    xhr.send();
  }
  function fail(first) {
    document.getElementById("offline").style.display = "block";
    if (first && !state) {
      try { var cached = JSON.parse(localStorage.getItem("tvState") || "null"); if (cached) apply(cached, true); } catch (e) {}
      if (!state) { show("empty"); }
    }
  }

  poll(true);
  setInterval(function () { poll(false); }, POLL_MS);
  setTimeout(function () { location.reload(); }, HARD_RELOAD_MS);
  // midnight: re-render so the "TODAY" highlight moves
  // if the menu is the only screen, it has to update in place (e.g. at midnight)
  setInterval(function () { if (order.length <= 1) ensureMenu(true); }, 60 * 1000);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { MenuRender.fit(document.getElementById("s-menu")); });
})();
</script>
</body>
</html>
