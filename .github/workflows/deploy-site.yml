name: Deploy website

# Deploys the Cloudflare site automatically whenever the website code changes.
# Needs one repo secret: CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions).
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

concurrency: deploy-site

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KV_ID: ${{ secrets.KV_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Fill in the storage (KV) id
        run: |
          if [ -z "$KV_ID" ]; then
            # find the namespace made earlier with "wrangler kv namespace create TV"
            KV_ID=$(npx wrangler kv namespace list | node -e '
              let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const i=s.search(/\[\s*[\{\]]/);const list=JSON.parse(s.slice(i));
                const hit=list.find(n=>n.title==="frat-tv-TV")||list.find(n=>n.title==="TV")||list.find(n=>/TV$/.test(n.title));
                if(!hit){console.error("No KV namespace ending in TV found: "+list.map(n=>n.title).join(", "));process.exit(1)}
                process.stdout.write(hit.id);
              })')
          fi
          echo "Using KV namespace $KV_ID"
          sed -i "s/PASTE_YOUR_KV_ID_HERE/$KV_ID/" wrangler.toml

      - name: Deploy
        run: npx wrangler deploy
