plugins { id "com.android.application" }

// The TV page URL is baked in at build time (GitHub Action input), e.g.
//   gradle assembleRelease -PtvUrl=https://frat-tv.yourname.workers.dev/tv
// It can also be changed on the TV later by pressing the remote's Menu (≡) button.
def tvUrl = project.findProperty("tvUrl") ?: ""

android {
    namespace "com.frattv.kiosk"
    compileSdk 34
    defaultConfig {
        applicationId "com.frattv.kiosk"
        minSdk 22
        targetSdk 28  // Fire OS is Android 9/11; 28 keeps auto-start-after-wake allowed
        versionCode 4
        versionName "1.3"
        buildConfigField "String", "TV_URL", "\"${tvUrl}\""
    }
    buildFeatures { buildConfig true }
    // One fixed signing key (kept in this repo) so every new build installs as an update
    // over the previous one. Android refuses updates signed with a different key.
    signingConfigs {
        house {
            storeFile rootProject.file("house-tv.keystore")
            storePassword "housetv123"
            keyAlias "housetv"
            keyPassword "housetv123"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.house
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
