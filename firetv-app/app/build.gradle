plugins { id "com.android.application" }

// The TV page URL is baked in at build time (GitHub Action input), e.g.
//   gradle assembleRelease -PtvUrl=https://frat-tv.yourname.workers.dev/tv
// It can also be changed on the TV later by pressing the remote's Menu (≡) button.
def tvUrl = project.findProperty("tvUrl") ?: ""

android {
    namespace "com.frattv.kiosk"
    compileSdk 34
    defaultConfig {
        applicationId "com.frattv.kiosk"
        minSdk 22
        targetSdk 28  // Fire OS is Android 9/11; 28 keeps auto-start-after-wake allowed
        versionCode 3
        versionName "1.2"
        buildConfigField "String", "TV_URL", "\"${tvUrl}\""
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release {
            minifyEnabled false
            // signed with the debug key so it installs on the Fire Stick without extra setup
            signingConfig signingConfigs.debug
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
